<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<body>

<header>
  <h2>Usuarios</h2>
  <nav>
    <a href="usuario.html">Usuarios</a>

<div class="container">

  <div class="card">
  <div class="form-layout">

    <div class="form-left">
      <div class="section-title">Agregar Usuario</div>
      <form>
        <input type="text" placeholder="Nombre Completo 👤">
        <input type="email" placeholder="Correo Electrónico 📧">
        <input type="password" placeholder="Contraseña 🔒">
        <button>Guardar Usuario</button>
      </form>
    </div>

    <div class="form-right">
      <div class="search-box">
        <div class="section-title">Buscar Usuario</div>
        <form>
          <input type="text" placeholder="Buscar por nombre o correo 🔍">
          <button>Buscar</button>
        </form>
      </div>
    </div>

  </div>
</div>

  <div class="card">
    <div class="section-title">Lista de Usuarios</div>
    <table>
        <!-- El thead es un elemento que se usa para agrupar el contenido de la cabecera dentro de una tabla-->
      <thead>
        <tr>
          <th>ID</th>
          <th>Nombre</th>
          <th>Correo</th>
          <th>Contraseña</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>

          </td>
        </tr>
        <tr>
          <td>2</td>

            <button class="action-btn">Editar 📝</button>

          </td>
        </tr>
      </tbody>
    </table>
  </div>

</div>

</body>
</html>
