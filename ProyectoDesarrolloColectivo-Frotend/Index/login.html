<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - Desarrollo Colectivo</title>
  <link rel="stylesheet" href="estilos.css" />
</head>
<body>

  <div class="contenedor">
    <h1 class="titulo">Desarrollo Colectivo</h1>

    <div class="tarjeta">
      <h2 class="subtitulo">Iniciar sesión</h2>

      <form class="formulario">
        <label for="correo">Correo</label>
        <input id="correo" type="email" placeholder="tu@correo.com" required />

        <label for="clave">Contraseña</label>
        <input id="clave" type="password" placeholder="••••••••" required />

        <button type="submit" class="btn">Entrar</button>
      </form>

      <p class="ayuda">
        <a class="link" href="#">¿Olvidaste tu contraseña?</a>
      </p>
      <p class="ayuda">
        ¿No tienes cuenta?
        <a class="link" href="register.html">Crear cuenta</a>
      </p>
    </div>

    <p class="footer">Proyecto Desarrollo Personal</p>
  </div>

</body>
</html>
