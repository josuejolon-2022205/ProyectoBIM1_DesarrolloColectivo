<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Registro - Desarrollo Colectivo</title>
  <link rel="stylesheet" href="login.css" />
</head>
<body>

  <div class="contenedor">
    <h1 class="titulo">Desarrollo Colectivo</h1>

    <div class="tarjeta">
      <h2 class="subtitulo">Crear cuenta</h2>

      <form class="formulario">
        <label for="nombre">Nombre completo</label>
        <input id="nombre" type="text" placeholder="Tu nombre" required />

        <label for="correo">Correo</label>
        <input id="correo" type="email" placeholder="tu@correo.com" required />

        <label for="clave">Contraseña</label>
        <input id="clave" type="password" placeholder="Mínimo 8 caracteres" required />

        <label for="confirmar">Confirmar contraseña</label>
        <input id="confirmar" type="password" placeholder="Repite tu contraseña" required />

        <button type="submit" class="btn">Registrarme</button>
      </form>

      <p class="ayuda">
        ¿Ya tienes cuenta?
        <a class="link" href="login.html">Iniciar sesión</a>
      </p>
    </div>

    <p class="footer">Proyecto Desarrollo Personal</p>
  </div>

</body>
</html>
